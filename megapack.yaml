# MegaPack build configuration — read by the ets2-mod-developer `megapack` skill.
# See docs/adr/ADR-0001-world-megapack.md for the model.
schema: 1

package:
  name: drivedog_world                   # archive: <name>_v<version>.scs
  versioned_filenames: true              # DriveDogs convention; each release is a new mod in the mod manager
  display_name: "DriveDogs: World"
  version: "1.2.0-dev.1"                 # World's own version, independent of sources
  author: "DevilDogTG"
  game: ets2                             # ets2 | ats — sources must be for this game
  manifest_template: src/manifest.sii
  description_template: src/description.txt

# No archive sources yet: every source is a subscribed Workshop item. `source_root` is still required, so it
# points at the Workshop folder and the archive scan ignores everything there.
source_root: "@steam_workshop"
workshop_root: "@steam_workshop"         # host file `## MegaPack Roots`
scan:
  ignore:
    - "*"

# Paths dropped from every source before merging (anchored at the source root).
exclude:
  - "manifest.sii"
  - "*.txt"
  - "*.jpg"
  - "*.png"

# Settings carried as edits of the base game (or of the merged winner, for Weather's climate), read from the
# extracted base game of this version. Each file is generated by one tool; a unit is edited in one file only.
# After a game update: extract the new base, bump the version, rerun the tools, rebuild, fix what
# `megapack check` reports. After a source update: rerun its tool and review the `skip` lines.
base_game:
  version: "1.61.1.1"
base_edits:
  edits:
    - world/edits.yaml                   # trains + level crossings (tools/harvest_edits.py)
    - world/graphics.yaml                # graphics sources' game config (tools/harvest_graphics.py)
    - world/climate.yaml                 # weather mix + night rain limits (tools/night_climate.py)
    - world/environment.yaml             # day/night date and storm chance (hand-written)
    - world/brands.yaml                  # company names, trailer paint jobs (tools/harvest_brands.py)
    - world/traffic_lights.yaml          # flashing-green timing (TrafficLights tools/generate_traffic_lights.py --world-edits)
  units: world/units                     # new def files (tools/harvest_brands.py)

# Mods whose edits world/ carries (never merged). `megapack updates` reports new versions.
references:
  - { id: train-lengths, name: Realistic Train Lengths, author: Femboy Enthusiast, workshop: 3209674677, version: "1.0" }
  # its locators carried onto the base bus-stop models and its definitions copied (tools/bus_stop_people.py)
  - { id: busy-bus-stations, name: Busy Bus Stations, author: d-luX, workshop: 2893480838, version: "1.00" }

parts:
  split_defs: false                      # definitions stay with their source's assets
  # one archive: a 5.09 GiB archive (6,944 entries, 1.1 GB of data and every folder listing past 4 GiB) loaded
  # clean in 0.2.0-dev.4 (maintainer, 2026-09-30). The 60,000-entry cap still applies.
  # The planner estimates Workshop sources unpacked (~2.4x the packed size), so this cap is set high enough that
  # World stays one archive (dev.7: ~16 GB estimated, ~6.7 GB packed).
  max_part_bytes: 34359738368
  max_part_files: 60000
  pack_margin: 0.9
