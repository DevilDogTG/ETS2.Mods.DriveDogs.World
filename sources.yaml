    name: DBM Vegetation
    author: DBM
    version: "1.8.1"
    workshop: 3809092031
    origin: { type: steam-workshop, url: "https://steamcommunity.com/sharedfiles/filedetails/?id=3809092031" }
    layer: 65
    overrides: ["juninho-grass", "diox-*", "juninho-tree"]

